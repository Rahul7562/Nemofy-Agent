[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemofy-agent-core"
version = "2.0.0"
description = "Pure-Python autonomous AI agent core powered by LangGraph, Docker Sandbox, Skills, and direct MCP servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3.0,<1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<4.0.0",
    "langchain-core>=0.3.30,<2.0.0",
    "langchain-openai>=0.3.0,<2.0.0",
    "langchain-mcp-adapters>=0.1.0,<1.0.0",
    "mcp>=1.6.0,<2.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "rich>=13.9.0,<15.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "docker>=7.1.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["Agent-Core", "."]
include = ["agent_core*", "MCPs*"]

[tool.pytest.ini_options]
testpaths = ["Agent-Core/tests"]
pythonpath = ["Agent-Core", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["Agent-Core", "MCPs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "S"]
ignore = [
    "E501",
    "S101",
    "S603",
    "S607",
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"Agent-Core/tests/*" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^node_modules/", "^dist/", "^\\.venv/", "^Nemofy Agent/"]
