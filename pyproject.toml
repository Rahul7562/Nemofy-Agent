[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-langgraph-agent"
version = "1.0.0"
description = "Production-grade multipurpose autonomous AI agent powered by LangGraph, Docker Sandbox, and n8n MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3.0,<1.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<4.0.0",
    "langchain-core>=0.3.30,<2.0.0",
    "langchain-openai>=0.3.0,<2.0.0",
    "langchain-mcp-adapters>=0.1.0,<1.0.0",
    "mcp>=1.6.0,<2.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "rich>=13.9.0,<15.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "markdownify>=0.14.1,<2.0.0",
    "docker>=7.1.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[project.scripts]
autonomous-agent = "main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "S"]
ignore = [
    "E501",     # code line-length enforced by ruff format; allows readable regexes/prompts/URLs
    "S101",     # assert allowed in tests
    "S603",     # controlled subprocess usage in sandbox
    "S607",     # controlled executable resolution
    "ASYNC109", # timeout parameter required in bash_exec tool and sandbox command API
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^\\.n8n-runtime/", "^node_modules/", "^dist/", "^\\.venv/"]
